global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

  # 高基数保护
  body_size_limit: 20MB
  sample_limit: 5000
  target_limit: 200
  label_limit: 40

  # 多实例部署添加实例标签，以区分数据
  external_labels:
    cluster: "test"
    env: "demo"

scrape_configs:
- job_name: prometheus-server
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - 192.168.1.221:9090

- job_name: 'node_exporter'
  metrics_path: /metrics
  scheme: http
  static_configs:
    - targets:
        - '192.168.1.221:9100'

- job_name: 'blackbox_exporter'
  metrics_path: /probe
  params:
    module: [http_2xx]
  static_configs:
    - targets:
      - http://192.168.1.240:30179/api/values
      - http://192.168.1.239:30179/api/values
      - http://192.168.1.238:30179/api/values
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      replacement: 192.168.1.221:9115

rule_files:
- /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

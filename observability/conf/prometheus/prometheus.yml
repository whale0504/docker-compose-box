global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

  # 高基数保护
  body_size_limit: 20MB
  sample_limit: 5000
  target_limit: 200
  label_limit: 40

  # 多实例部署添加实例标签，以区分数据
  external_labels:
    cluster: "test"
    env: "demo"

scrape_configs:
- job_name: prometheus-server
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - 192.168.1.221:9090

rule_files:
- /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
